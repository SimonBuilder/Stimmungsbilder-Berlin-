<style>
  :root{
    --pink:#dc5498;
    --ink:#4a4a4a;
    --lockup-left:14.54%;
    --lockup-width:70.91%;
    --lockup-center-y:47.86%;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    color:var(--ink);
  }

  main{
    position:relative;
    min-height:100svh;
    min-height:100vh;
  }

  /* Der Schriftzug sitzt exakt auf den aus der PNG gemessenen Proportionen */
  .lockup{
    position:absolute;
    left:var(--lockup-left);
    width:var(--lockup-width);
    max-width:1500px;
    top:var(--lockup-center-y);
    transform:translateY(-50%);
  }

  .lockup svg{
    display:block;
    width:100%;
    height:auto;
    overflow:visible;
    color:var(--pink);
  }

  .wordmark{
    fill:currentColor;
    opacity:0;
    animation:fade 1s cubic-bezier(.33,0,.2,1) .25s forwards;
  }

  .rule{
    fill:none;
    stroke:currentColor;
    stroke-width:11;
    stroke-miterlimit:10;
    stroke-dasharray:1;
    stroke-dashoffset:1;
    animation:draw 1.4s cubic-bezier(.22,1,.36,1) .75s forwards;
  }

  @keyframes fade{to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}

  footer{
    position:absolute;
    left:var(--lockup-left);
    right:var(--lockup-left);
    bottom:4.2%;
    display:flex;
    gap:2rem;
    font-size:.75rem;
    letter-spacing:.02em;
    opacity:0;
    animation:fade 1s ease-out 1.9s forwards;
  }

  footer a{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid rgba(0,0,0,.22);
    padding-bottom:1px;
  }

  footer a:hover,
  footer a:focus-visible{border-bottom-color:var(--pink);color:var(--pink)}

  footer a:focus-visible{outline:2px solid var(--pink);outline-offset:4px;border-radius:1px}

  /* Schmale Bildschirme: Zeile darf breiter stehen, sonst wird sie unlesbar klein */
  @media (max-width:700px){
    :root{
      --lockup-left:7%;
      --lockup-width:86%;
      --lockup-center-y:46%;
    }
    footer{gap:1.25rem;font-size:.7rem;bottom:6%}
  }

  @media (prefers-reduced-motion:reduce){
    .wordmark,.rule,footer{animation:none;opacity:1}
    .rule{stroke-dashoffset:0}
  }
</style>
</head>
